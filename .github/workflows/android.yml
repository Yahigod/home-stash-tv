name: Android

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate release policy
        run: python3 scripts/validate-release-policy.py

      - name: Configure stable development signing
        env:
          HOME_STASH_TV_DEBUG_KEYSTORE_B64: ${{ secrets.HOME_STASH_TV_DEBUG_KEYSTORE_B64 }}
          HOME_STASH_TV_KEYSTORE_PASSWORD: ${{ secrets.HOME_STASH_TV_DEBUG_KEYSTORE_PASSWORD }}
          HOME_STASH_TV_KEY_ALIAS: ${{ secrets.HOME_STASH_TV_DEBUG_KEY_ALIAS }}
          HOME_STASH_TV_KEY_PASSWORD: ${{ secrets.HOME_STASH_TV_DEBUG_KEY_PASSWORD }}
        run: |
          for name in \
            HOME_STASH_TV_DEBUG_KEYSTORE_B64 \
            HOME_STASH_TV_KEYSTORE_PASSWORD \
            HOME_STASH_TV_KEY_ALIAS \
            HOME_STASH_TV_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Stable development signing is not configured."
              exit 1
            fi
          done
          printf '%s' "$HOME_STASH_TV_DEBUG_KEYSTORE_B64" \
            | base64 --decode > "$RUNNER_TEMP/home-stash-tv-debug.p12"
          chmod 600 "$RUNNER_TEMP/home-stash-tv-debug.p12"

      - name: Verify
        env:
          HOME_STASH_TV_KEYSTORE_FILE: ${{ runner.temp }}/home-stash-tv-debug.p12
          HOME_STASH_TV_KEYSTORE_PASSWORD: ${{ secrets.HOME_STASH_TV_DEBUG_KEYSTORE_PASSWORD }}
          HOME_STASH_TV_KEY_ALIAS: ${{ secrets.HOME_STASH_TV_DEBUG_KEY_ALIAS }}
          HOME_STASH_TV_KEY_PASSWORD: ${{ secrets.HOME_STASH_TV_DEBUG_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-stash-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
